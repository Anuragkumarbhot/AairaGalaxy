<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#001515">
  <title>AairaGalaxy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <header class="header">
    <h1 class="logo">AAIRAGALAXY</h1>
    <time id="clock" aria-label="Local time"></time>
  </header>
  <aside class="leftpanel">
    <section class="hudbox">
      <h2>NEURAL CORE</h2>
      <div class="meter"><div class="meterfill"></div></div>
      <p>System interface active</p>
    </section>
    <section class="hudbox">
      <h2>LIVE SYSTEM</h2>
      <div class="sysrow">CPU <div class="sysbar"><div id="cpuBar"></div></div></div>
      <div class="sysrow">RAM <div class="sysbar"><div id="ramBar"></div></div></div>
      <div class="sysrow">NETWORK <div class="sysbar"><div id="netBar"></div></div></div>
      <div class="sysrow">BATTERY <div class="sysbar"><div id="batteryBar"></div></div></div>
      <p class="telemetry-note">Browser-exposed metrics only</p>
    </section>
  </aside>
  <main class="center">
    <div class="solar" aria-label="Animated solar system">
      <div class="hologram"><div class="holoCore"></div><div class="holoRing"></div><div class="holoRing ring2"></div></div>
      <div class="scanring"></div><div class="sun"></div>
      <div class="orbit o1"><div class="planet mercury"></div></div>
      <div class="orbit o2"><div class="planet venus"></div></div>
      <div class="orbit o3"><div class="planet earth"></div></div>
      <div class="orbit o4"><div class="planet mars"></div></div>
      <div class="orbit o5"><div class="planet jupiter"></div></div>
      <div class="orbit o6"><div class="planet saturn"><div class="saturnring"></div></div></div>
    </div>
  </main>
  <section class="sidepanel" aria-label="Aaira assistant">
    <div class="voice-controls">
      <label for="voiceLanguage">Voice language</label>
      <select id="voiceLanguage" aria-label="Choose voice language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="pa">ਪੰਜਾਬੀ</option>
      </select>
      <button id="wakeWordButton" type="button" onclick="toggleWakeWord()">Enable wake word</button>
      <p class="voice-note">Wake word works only while this page is open and listening.</p>
    </div>
    <div class="console" id="chatbox" role="log" aria-live="polite">
      <div>&gt; AAIRAGALAXY ONLINE...</div>
      <div>&gt; Neural systems initialized.</div>
    </div>
    <label class="sr-only" for="userInput">Message AairaGalaxy</label>
    <input id="userInput" type="text" placeholder="Talk to Aaira..." autocomplete="off">
    <button type="button" onclick="sendMessage()">Send message</button>
    <button type="button" onclick="speakAI()">Speak to Aaira</button>
    <div class="history-controls">
      <button type="button" onclick="exportConversation()">Export history</button>
      <button type="button" onclick="clearConversation()">Clear history</button>
    </div>
    <video id="webcam" autoplay muted playsinline aria-label="Camera preview"></video>
  </section>
  <div class="bottompanel" aria-label="Music visualizer">
    <div class="musicbar"></div><div class="musicbar"></div><div class="musicbar"></div><div class="musicbar"></div>
    <div class="musicbar"></div><div class="musicbar"></div><div class="musicbar"></div><div class="musicbar"></div>
  </div>
  <script src="js/stars.js"></script>
  <script src="js/solar.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/gesture.js"></script>
  <script src="js/music.js"></script>
  <script src="js/telemetry.js"></script>
  <script src="js/hologram.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
