<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AairaGalaxy</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<canvas id="bg"></canvas>

<div class="nebula"></div>

<div class="bootscreen" id="bootscreen">
<h1>AAIRAGALAXY</h1>
<p>INITIALIZING NEURAL SYSTEMS...</p>
</div>

<div class="hud">

<div class="header">
<h1>AAIRAGALAXY</h1>
<div id="clock"></div>
</div>

<div class="center">

<div class="solar">
<div class="sun"></div>
<div class="scanring"></div>
<div class="asteroidbelt"></div>

<div class="orbit o1">
<div class="planet mercury"></div>
</div>

<div class="orbit o2">
<div class="planet venus"></div>
</div>

<div class="orbit o3">
<div class="planet earth"></div>
</div>

<div class="orbit o4">
<div class="planet mars"></div>
</div>

<div class="orbit o5">
<div class="planet jupiter"></div>
</div>

<div class="orbit o6">
<div class="planet saturn">
<div class="saturnring"></div>
</div>
</div>

<div class="hologram"></div>

</div>

</div>

<div class="sidepanel">

<div class="voicepanel">
<button onclick="speakAI()">Activate Aaira</button>
</div>

<div class="console" id="chatbox">
> AAIRAGALAXY ONLINE...
</div>

<input id="userInput" placeholder="Enter command...">

<button onclick="sendMessage()">
Execute Command
</button>

<video id="webcam" autoplay playsinline></video>

</div>

</div>

<script src="js/stars.js"></script>
<script src="js/solar.js"></script>
<script src="js/voice.js"></script>
<script src="js/ai.js"></script>
<script src="js/gesture.js"></script>
<script src="js/music.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/hologram.js"></script>
<script src="js/app.js"></script>

</body>
</html>
